name: Build Android APK (Kivy / Buildozer)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar dependencias de sistema para Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip build-essential git ffmpeg libsdl2-dev \
            libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev \
            zlib1g-dev libgstreamer1.0 gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good openjdk-17-jdk autoconf libtool \
            pkg-config libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev zip unzip

      - name: Instalar Buildozer y Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Cache de .buildozer
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Compilar APK debug con Buildozer
        run: |
          yes | buildozer android debug

      - name: Subir APK como Artifact descargable
        uses: actions/upload-artifact@v4
        with:
          name: SubliminalFlash-Android-APK
          path: bin/*.apk
